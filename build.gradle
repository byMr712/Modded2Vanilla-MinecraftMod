plugins {
    id 'fabric-loom' version "1.18-SNAPSHOT"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.shedaniel.me/" }
}

loom {
    if (!project.hasProperty('yarn_mappings') || project.property('yarn_mappings').toString().trim().isEmpty()) {
        noIntermediateMappings()
    }
    runs {
        client {
            property "fabric.runtimeMappingNamespace", "named"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (project.hasProperty('yarn_mappings') && !project.property('yarn_mappings').toString().trim().isEmpty()) {
        mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    } else {
        mappings files("empty-mappings.jar")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    def fabricApi = project.findProperty('fabric_api_version') ?: project.findProperty('fabric_version')
    if (fabricApi) {
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApi}"
    }

    if (project.hasProperty('modmenu_version') && !project.property('modmenu_version').toString().trim().isEmpty()) {
        modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version, "minecraft_version": project.minecraft_version
    }
}

def targetJavaVersion = project.minecraft_version.startsWith('26') ? 25 : 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release = targetJavaVersion
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

remapJar {
    archiveFileName = "${project.archives_base_name}.jar"
}

// Ensure single jar output
tasks.matching { it.name == 'sourcesJar' || it.name == 'remapSourcesJar' || it.name == 'javadocJar' }.configureEach {
    enabled = false
}

sourceSets {
    neoforge {
        java {
            srcDirs = ['src/neoforge/java']
        }
        resources {
            srcDirs = ['src/neoforge/resources']
        }
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
    }
}

processNeoforgeResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version, "minecraft_version": project.minecraft_version
    }
}

def isYarnBranch = project.hasProperty('yarn_mappings') && !project.property('yarn_mappings').toString().trim().isEmpty()

def remapIntermediaryJarToMojmap = { File jarFile, String mcVer ->
    def loomCacheDir = new File(gradle.gradleUserHomeDir, "caches/fabric-loom/${mcVer}")
    def tinyFile = null
    if (loomCacheDir.exists()) {
        loomCacheDir.eachFileRecurse { f ->
            if (f.name == "mappings.tiny" && f.parentFile.name.startsWith("loom.mappings.")) {
                tinyFile = f
            }
        }
    }
    if (tinyFile == null || !tinyFile.exists()) {
        throw new GradleException("Could not find Mojmap mappings.tiny in ${loomCacheDir}")
    }

    def classMap = [:]
    def shortClassMap = [:]
    def methodMap = [:]
    def fieldMap = [:]
    tinyFile.eachLine("UTF-8") { line ->
        def t = line.trim().split("\t")
        if (t[0] == "c" && t.length >= 4 && t[2].startsWith("net/minecraft/class_")) {
            classMap[t[2]] = t[3]
            def iParts = t[2].split('\\$')
            def mParts = t[3].split('\\$')
            if (iParts.length == mParts.length) {
                for (int i = 0; i < iParts.length; i++) {
                    def iShort = iParts[i].contains("/") ? iParts[i].substring(iParts[i].lastIndexOf("/") + 1) : iParts[i]
                    def mShort = mParts[i].contains("/") ? mParts[i].substring(mParts[i].lastIndexOf("/") + 1) : mParts[i]
                    shortClassMap[iShort] = mShort
                }
            }
        } else if (t[0] == "m" && t.length >= 5 && (t[3].startsWith("method_") || t[3].startsWith("comp_"))) {
            methodMap[t[3]] = t[4]
        } else if (t[0] == "f" && t.length >= 5 && t[3].startsWith("field_")) {
            fieldMap[t[3]] = t[4]
        }
    }

    def remapString = { String str ->
        if (!str.contains("class_") && !str.contains("method_") && !str.contains("comp_") && !str.contains("field_")) {
            return str
        }
        String res = str.replaceAll(/net\/minecraft\/class_\d+(?:\$class_\d+)*/) { m -> classMap.getOrDefault(m, m) }
        res = res.replaceAll(/\bclass_\d+\b/) { m -> shortClassMap.getOrDefault(m, m) }
        res = res.replaceAll(/\b(?:method|comp)_\d+\b/) { m -> methodMap.getOrDefault(m, m) }
        res = res.replaceAll(/\bfield_\d+\b/) { m -> fieldMap.getOrDefault(m, m) }
        return res
    }

    def remapClassBytes = { byte[] bytes ->
        def dis = new java.io.DataInputStream(new java.io.ByteArrayInputStream(bytes))
        def baos = new java.io.ByteArrayOutputStream(bytes.length + 1024)
        def dos = new java.io.DataOutputStream(baos)
        dos.writeInt(dis.readInt())
        dos.writeShort(dis.readUnsignedShort())
        dos.writeShort(dis.readUnsignedShort())
        int cpCount = dis.readUnsignedShort()
        dos.writeShort(cpCount)
        for (int i = 1; i < cpCount; i++) {
            int tag = dis.readUnsignedByte()
            dos.writeByte(tag)
            switch (tag) {
                case 1:
                    int len = dis.readUnsignedShort()
                    byte[] utfBytes = new byte[len]
                    dis.readFully(utfBytes)
                    String mapped = remapString(new String(utfBytes, java.nio.charset.StandardCharsets.UTF_8))
                    byte[] outBytes = mapped.getBytes(java.nio.charset.StandardCharsets.UTF_8)
                    dos.writeShort(outBytes.length)
                    dos.write(outBytes)
                    break
                case 3: case 4: case 9: case 10: case 11: case 12: case 17: case 18:
                    byte[] b4 = new byte[4]; dis.readFully(b4); dos.write(b4); break
                case 5: case 6:
                    byte[] b8 = new byte[8]; dis.readFully(b8); dos.write(b8); i++; break
                case 7: case 8: case 16: case 19: case 20:
                    byte[] b2 = new byte[2]; dis.readFully(b2); dos.write(b2); break
                case 15:
                    byte[] b3 = new byte[3]; dis.readFully(b3); dos.write(b3); break
                default:
                    throw new GradleException("Unknown constant pool tag: " + tag)
            }
        }
        byte[] rest = dis.readAllBytes()
        dos.write(rest)
        dos.flush()
        return baos.toByteArray()
    }

    File tempJar = new File(jarFile.parentFile, jarFile.name + ".tmp")
    new java.util.zip.ZipFile(jarFile).withCloseable { zf ->
        new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(tempJar)).withCloseable { zos ->
            def entries = zf.entries()
            while (entries.hasMoreElements()) {
                def entry = entries.nextElement()
                byte[] data = zf.getInputStream(entry).bytes
                if (entry.name.endsWith(".class") && entry.name.startsWith("com/mr712/")) {
                    data = remapClassBytes(data)
                }
                def newEntry = new java.util.zip.ZipEntry(entry.name)
                newEntry.time = entry.time
                zos.putNextEntry(newEntry)
                zos.write(data)
                zos.closeEntry()
            }
        }
    }
    if (!jarFile.delete() || !tempJar.renameTo(jarFile)) {
        java.nio.file.Files.move(tempJar.toPath(), jarFile.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}

task jarNeoForge(type: Jar) {
    dependsOn compileNeoforgeJava, processNeoforgeResources
    if (isYarnBranch) {
        dependsOn remapJar
    }
    archiveFileName = "${project.archives_base_name.replace('-Fabric-', '-NeoForge-')}.jar"
    destinationDirectory = layout.buildDirectory.dir("libs")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    if (isYarnBranch) {
        from({ zipTree(remapJar.archiveFile) }) {
            exclude "fabric.mod.json"
            exclude "*-refmap.json"
            exclude "net/**"
            exclude "com/mr712/modded2vanilla/MrModded2VanillaFabric*.class"
        }
    } else {
        from(sourceSets.main.output) {
            exclude "fabric.mod.json"
            exclude "net/**"
            exclude "com/mr712/modded2vanilla/MrModded2VanillaFabric*.class"
        }
    }
    from(sourceSets.neoforge.output) {
        exclude "net/**"
    }
    from("src/main/resources") {
        include "assets/**"
        include "data/**"
        include "modded2vanilla.mixins.json"
    }
    from("LICENSE")

    doLast {
        if (isYarnBranch) {
            remapIntermediaryJarToMojmap(archiveFile.get().asFile, project.minecraft_version.toString())
        }
    }
}

build.dependsOn(jarNeoForge)

def userHome = System.getProperty("user.home")
def allBuildsDir = System.getenv("ALL_BUILDS_DIR") ? file(System.getenv("ALL_BUILDS_DIR")) : file("${userHome}/Documents/MrModded2Vanilla_all_builds")
if (allBuildsDir.exists()) {
    tasks.register('copyToAllBuildsFabric', Copy) {
        dependsOn remapJar
        from remapJar.archiveFile
        into file("${allBuildsDir}/Fabric")
        doLast {
            copy {
                from remapJar.archiveFile
                into allBuildsDir
            }
            println ">>> Copied ${remapJar.archiveFileName.get()} to ${allBuildsDir.absolutePath}/Fabric!"
        }
    }

    tasks.register('copyToAllBuildsNeoForge', Copy) {
        dependsOn jarNeoForge
        from jarNeoForge.archiveFile
        into file("${allBuildsDir}/NeoForge")
        doLast {
            copy {
                from jarNeoForge.archiveFile
                into allBuildsDir
            }
            println ">>> Copied ${jarNeoForge.archiveFileName.get()} to ${allBuildsDir.absolutePath}/NeoForge!"
        }
    }

    task copyToAllBuilds {
        dependsOn copyToAllBuildsFabric, copyToAllBuildsNeoForge
    }

    build.finalizedBy(copyToAllBuilds)
}

def isWindows = System.getProperty("os.name").toLowerCase().contains("win")
def appData = System.getenv("APPDATA") ?: (isWindows ? "${userHome}/AppData/Roaming" : "${userHome}/.local/share")
def atLauncherDir = System.getenv("ATLAUNCHER_DIR") ? file(System.getenv("ATLAUNCHER_DIR")) : file("${appData}/ATLauncher")
def launcherNeoForgeDir = file("${atLauncherDir}/instances/Minecraft${project.minecraft_version.replace('.', '')}withNeoForge/mods")

tasks.register('copyToLauncherNeoForge', Copy) {
    dependsOn jarNeoForge
    from jarNeoForge.archiveFile
    into launcherNeoForgeDir
    onlyIf { launcherNeoForgeDir.exists() }
    doLast {
        if (launcherNeoForgeDir.exists()) {
            println ">>> Copied ${jarNeoForge.archiveFileName.get()} to ATLauncher NeoForge instance mods folder!"
        }
    }
}
if (launcherNeoForgeDir.exists()) {
    build.finalizedBy(copyToLauncherNeoForge)
}

tasks.register('testFabric', Exec) {
    group = "verification"
    description = "Runs automated Fabric client test against vanilla multiplayer server."
    workingDir project.projectDir
    def targetServer = project.findProperty('server') ?: "hub.opblocks.com"
    commandLine "pwsh", "-ExecutionPolicy", "Bypass", "-File", "scripts/run_fabric_test.ps1", "-Server", targetServer
}

tasks.register('testNeoForge', Exec) {
    group = "verification"
    description = "Runs automated NeoForge client test against vanilla multiplayer server."
    dependsOn jarNeoForge, copyToLauncherNeoForge
    workingDir project.projectDir
    def targetServer = project.findProperty('server') ?: "hub.opblocks.com"
    def mcVer = project.minecraft_version
    commandLine "pwsh", "-ExecutionPolicy", "Bypass", "-File", "scripts/run_neoforge_test.ps1", "-Server", targetServer, "-McVersion", mcVer
}
