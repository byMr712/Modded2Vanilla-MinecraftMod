plugins {
    id 'fabric-loom' version "1.18-SNAPSHOT"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.shedaniel.me/" }
}

loom {
    if (project.minecraft_version.startsWith('26')) {
        noIntermediateMappings()
    }
    runs {
        client {
            property "fabric.runtimeMappingNamespace", "named"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (project.minecraft_version.startsWith('26')) {
        mappings files("empty-mappings.jar")
    } else {
        mappings loom.officialMojangMappings()
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    def fabricApi = project.findProperty('fabric_api_version') ?: project.findProperty('fabric_version')
    if (fabricApi) {
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApi}"
    }

    compileOnly "io.github.llamalad7:mixinextras-common:0.4.1"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.4.1"

    if (project.hasProperty('modmenu_version') && !project.property('modmenu_version').toString().trim().isEmpty()) {
        modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version, "minecraft_version": project.minecraft_version
    }
}

def targetJavaVersion = project.minecraft_version.startsWith('26') ? 25 : 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release = targetJavaVersion
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

remapJar {
    archiveFileName = "${project.archives_base_name}.jar"
}

// Ensure single jar output
tasks.matching { it.name == 'sourcesJar' || it.name == 'remapSourcesJar' || it.name == 'javadocJar' }.configureEach {
    enabled = false
}

sourceSets {
    neoforge {
        java {
            srcDirs = ['src/neoforge/java']
        }
        resources {
            srcDirs = ['src/neoforge/resources']
        }
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
    }
}

processNeoforgeResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version, "minecraft_version": project.minecraft_version
    }
}

task jarNeoForge(type: Jar) {
    dependsOn compileNeoforgeJava, processNeoforgeResources
    archiveFileName = "${project.archives_base_name.replace('-Fabric-', '-NeoForge-')}.jar"
    destinationDirectory = layout.buildDirectory.dir("libs")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(sourceSets.main.output) {
        exclude "fabric.mod.json"
        exclude "net/**"
        exclude "com/mr712/modded2vanilla/MrModded2VanillaFabric*.class"
    }
    from(sourceSets.neoforge.output) {
        exclude "net/**"
    }
    from("src/main/resources") {
        include "assets/**"
        include "data/**"
        include "modded2vanilla.mixins.json"
    }
    from("src/main/resources/assets/modded2vanilla/icon.png") {
        into ""
    }
    from("LICENSE")
}

build.dependsOn(jarNeoForge)

def allBuildsDir = file("C:/Users/Mr712/Documents/MrModded2Vanilla_all_builds")
tasks.register('copyToAllBuildsFabric', Copy) {
    dependsOn remapJar
    from remapJar.archiveFile
    into file("${allBuildsDir}/Fabric")
    doLast {
        copy {
            from remapJar.archiveFile
            into allBuildsDir
        }
        println ">>> Copied ${remapJar.archiveFileName.get()} to ${allBuildsDir.absolutePath}/Fabric!"
    }
}

tasks.register('copyToAllBuildsNeoForge', Copy) {
    dependsOn jarNeoForge
    from jarNeoForge.archiveFile
    into file("${allBuildsDir}/NeoForge")
    doLast {
        copy {
            from jarNeoForge.archiveFile
            into allBuildsDir
        }
        println ">>> Copied ${jarNeoForge.archiveFileName.get()} to ${allBuildsDir.absolutePath}/NeoForge!"
    }
}

task copyToAllBuilds {
    dependsOn copyToAllBuildsFabric, copyToAllBuildsNeoForge
}

build.finalizedBy(copyToAllBuilds)

def launcherNeoForgeDir = file("C:/Users/Mr712/AppData/Roaming/ATLauncher/instances/Minecraft${project.minecraft_version.replace('.', '')}withNeoForge/mods")
if (launcherNeoForgeDir.exists()) {
    tasks.register('copyToLauncherNeoForge', Copy) {
        dependsOn jarNeoForge
        from jarNeoForge.archiveFile
        into launcherNeoForgeDir
        doLast {
            println ">>> Copied ${jarNeoForge.archiveFileName.get()} to ATLauncher NeoForge instance mods folder!"
        }
    }
    build.finalizedBy(copyToLauncherNeoForge)
}

tasks.register('testFabric', Exec) {
    group = "verification"
    description = "Runs automated Fabric client test against vanilla multiplayer server."
    workingDir project.projectDir
    def targetServer = project.findProperty('server') ?: "hub.opblocks.com"
    commandLine "pwsh", "-ExecutionPolicy", "Bypass", "-File", "scripts/run_fabric_test.ps1", "-Server", targetServer
}

tasks.register('testNeoForge', Exec) {
    group = "verification"
    description = "Runs automated NeoForge client test against vanilla multiplayer server."
    dependsOn jarNeoForge, 'copyToLauncherNeoForge'
    workingDir project.projectDir
    def targetServer = project.findProperty('server') ?: "hub.opblocks.com"
    commandLine "pwsh", "-ExecutionPolicy", "Bypass", "-File", "scripts/run_neoforge_test.ps1", "-Server", targetServer
}
